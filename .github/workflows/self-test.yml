name: "Self-Test: Trailhead on own PRs"

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # Re-evaluate required_approvals as soon as formal review state changes.
  pull_request_review:
    types: [submitted, dismissed]

concurrency:
  group: trailhead-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ ((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'trailhead-override') && github.run_id || 'gate' }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write
  security-events: read

jobs:
  gate:
    name: "Trailhead Self-Test"
    if: >-
      github.event.pull_request.base.ref == 'dev' &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'trailhead-override')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build action
        run: npm run build

      - name: Run fixture and gate tests
        run: npm run test -- src/__tests__/fixture-scenarios.test.ts src/__tests__/agent-failure-fixtures.test.ts src/__tests__/release-ready.test.ts src/__tests__/ci-orchestrator.test.ts src/__tests__/context-matcher.test.ts src/__tests__/config.test.ts src/__tests__/evaluate-gate.test.ts src/__tests__/gate.test.ts src/__tests__/mcp.test.ts

      - name: Run Trailhead (release-ready mode)
        id: gate
        uses: ./
        with:
          gate-mode: release-ready
          wait-for-checks: "true"
          wait-timeout-minutes: "15"
          risk-threshold: "90"
          warn-threshold: "50"
          fail-mode: "open"
          dora-metrics: "true"
          security-gate: "true"

      - name: Validate structured outputs
        if: always()
        env:
          EVALUATION_JSON: ${{ steps.gate.outputs.evaluation-json }}
          ROLLOUT_READINESS_JSON: ${{ steps.gate.outputs.rollout-readiness-json }}
          RELEASE_READY: ${{ steps.gate.outputs.release-ready }}
        run: |
          node -e "const e=JSON.parse(process.env.EVALUATION_JSON); if(!e.pr || !e.pr.provenance) { throw new Error('Missing pr.provenance in evaluation-json'); } if(!e.trust_profile){ throw new Error('Missing trust_profile in evaluation-json'); }"
          node -e "const r=JSON.parse(process.env.ROLLOUT_READINESS_JSON); if(!['go','review','hold'].includes(r.band)){ throw new Error('Invalid rollout readiness band'); } if(typeof r.ready!=='boolean'){ throw new Error('rollout ready flag missing'); }"
          node -e "const ready=process.env.RELEASE_READY; if(ready!=='true' && ready!=='false'){ throw new Error('release-ready output must be true or false'); }"

      - name: Print outputs
        if: always()
        env:
          GATE_DECISION: ${{ steps.gate.outputs.gate-decision }}
          RELEASE_READY: ${{ steps.gate.outputs.release-ready }}
          RISK_SCORE: ${{ steps.gate.outputs.risk-score }}
          HEALTH_SCORE: ${{ steps.gate.outputs.health-score }}
          REPORT_URL: ${{ steps.gate.outputs.report-url }}
          DORA_RATING: ${{ steps.gate.outputs.dora-rating }}
          ROLLOUT_READINESS_JSON: ${{ steps.gate.outputs.rollout-readiness-json }}
          EVALUATION_JSON: ${{ steps.gate.outputs.evaluation-json }}
        run: |
          printf '%s\n' "gate-decision:  $GATE_DECISION"
          printf '%s\n' "release-ready:  $RELEASE_READY"
          printf '%s\n' "risk-score:     $RISK_SCORE"
          printf '%s\n' "health-score:   $HEALTH_SCORE"
          printf '%s\n' "report-url:     $REPORT_URL"
          printf '%s\n' "dora-rating:    $DORA_RATING"
          printf '%s\n' "rollout:        $ROLLOUT_READINESS_JSON"
          printf '\n%s\n' "--- evaluation-json (truncated) ---"
          printf '%s' "$EVALUATION_JSON" | head -c 500
          printf '\n'

  advisory:
    name: "Trailhead Advisory Self-Test"
    if: >-
      github.event.pull_request.base.ref == 'dev' &&
      ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'trailhead-override')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci && npm run build

      - name: Run Trailhead (advisory mode — never blocks workflow)
        id: advisory
        uses: ./
        with:
          gate-mode: advisory
          check-name: "Trailhead — Advisory Self-Test"
          risk-threshold: "1"
          fail-mode: "open"

      - name: Validate advisory outputs
        env:
          RELEASE_READY: ${{ steps.advisory.outputs.release-ready }}
          GATE_DECISION: ${{ steps.advisory.outputs.gate-decision }}
        run: |
          node -e "const ready=process.env.RELEASE_READY; if(ready!=='true' && ready!=='false'){ throw new Error('release-ready output missing'); }"
          printf '%s\n' "Advisory gate-decision: $GATE_DECISION"
