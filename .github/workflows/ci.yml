name: CI

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  check:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: ESLint + TypeScript (src/)
        run: npm run lint

      - name: Typecheck cli/
        run: |
          cd cli && npm ci && npm run prebuild && npx tsc --noEmit

      - name: Typecheck app/
        run: |
          cd app && npm ci && npm run prebuild && npx tsc --noEmit

      - name: Typecheck mcp/
        run: |
          cd mcp && npm ci && npm run prebuild && npx tsc --noEmit

      - name: Typecheck cloud/
        run: |
          cd cloud && npm ci && npm run prebuild && npx tsc --noEmit

      - name: Cloud API tests
        run: |
          cd cloud && npm run prebuild && npm test

      - name: Tests with coverage
        run: npx vitest run --coverage

      - name: Build (ncc)
        run: npm run build

      - name: Verify dist/ is up to date
        run: |
          # licenses.txt varies slightly by ncc host OS (native binding metadata);
          # index.js + platform .node binaries are the runtime contract.
          git diff --exit-code dist/index.js dist/sourcemap-register.js || {
            echo "::error::dist/index.js is out of date — run 'npm run build' and commit"
            exit 1
          }
          git diff --exit-code -- dist/*.node || {
            echo "::error::dist/*.node is out of date — run 'npm run build' and commit"
            exit 1
          }
