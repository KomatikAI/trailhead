name: CI

on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]

permissions:
  contents: read

jobs:
  cloud-contract:
    name: Cloud PostgreSQL contracts
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: trailhead_test
          POSTGRES_PASSWORD: local_contract_test
          POSTGRES_DB: trailhead_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U trailhead_test -d trailhead_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloud/package-lock.json
      # Cloud's tests inherit the repository Vitest configuration.
      - run: npm ci
      - run: npm ci
        working-directory: cloud
      - run: npm test
        working-directory: cloud
        env:
          TEST_DATABASE_URL: postgresql://trailhead_test:local_contract_test@localhost:5432/trailhead_test

  site:
    name: Website lint, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloud/package-lock.json
            site/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: cloud
      - run: npm ci
        working-directory: site
      - run: npm run lint
        working-directory: site
      - run: npm run typecheck
        working-directory: site
      - run: npm test
        working-directory: site
      - run: npm run build
        working-directory: site

  dependencies:
    name: Dependency audit (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [".", app, cli, cloud, mcp, site]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm audit --package-lock-only --audit-level=high
        working-directory: ${{ matrix.package }}

  check:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: ESLint + TypeScript (src/)
        run: npm run lint

      - name: Typecheck cli/
        run: |
          cd cli && npm ci && npm run typecheck

      - name: Build CLI bundle
        run: npm run build:cli

      - name: Install CLI runtime deps (@swc/core optional platform binding)
        working-directory: cli
        run: npm ci --omit=dev

      - name: Verify CLI bundle (offline doctor)
        run: node cli/dist/index.js doctor --offline --path .

      - name: Dry-run simulator smoke
        run: node scripts/run-simulate.mjs --threshold 100

      - name: Typecheck app/
        run: |
          cd app && npm ci && npm run prebuild && npx tsc --noEmit

      - name: Typecheck mcp/
        run: |
          cd mcp && npm ci && npm run build

      - name: Verify shared sources and MCP runtime are committed
        run: git diff --exit-code -- app/src mcp/src mcp/dist

      - name: Typecheck cloud/
        run: |
          cd cloud && npm ci && npm run prebuild && npx tsc --noEmit

      - name: Cloud API tests
        run: |
          cd cloud && npm run prebuild && npm test

      - name: Tests with coverage
        run: npx vitest run --coverage

      - name: Build (ncc)
        run: npm run build

      # dist/index.js embeds ncc module IDs that vary by build-host OS; CI validates
      # the bundle compiles on linux. Maintainers run `npm run build` before release;
      # release.yml rebuilds on ubuntu-latest before tagging.
