# Reusable workflow: Trailhead Release Readiness Gate (v4)
#
# Consumers:
#   jobs:
#     release-ready:
#       permissions:
#         contents: read
#         pull-requests: write
#         checks: write
#         security-events: read
#       uses: KomatikAI/trailhead/.github/workflows/release-ready.yml@v4
#       secrets:
#         evaluation-store-secret: ${{ secrets.TRAILHEAD_STORE_SECRET }}
#
# The caller owns PR triggers. Include pull_request activity types labeled and
# unlabeled, and filter those actions to the trailhead-override label as shown
# in docs/getting-started.md. In branch protection, require the custom check named
# by check-name (default Trailhead for risk-only, Trailhead — Release Ready otherwise),
# not the caller workflow job name.
#
name: Trailhead Release Ready

on:
  workflow_call:
    inputs:
      gate-mode:
        description: "release-ready | advisory | risk-only"
        type: string
        default: "release-ready"
      check-name:
        description: "Custom protected check name; empty uses the gate-mode default"
        type: string
        default: ""
      risk-threshold:
        description: "Block when risk score exceeds this value (0-100)"
        type: string
        default: "70"
      wait-for-checks:
        description: "Poll GitHub Checks until required checks finish"
        type: boolean
        default: true
      wait-timeout-minutes:
        description: "Max minutes to wait for CI checks"
        type: string
        default: "30"
      environment:
        description: "Deployment environment for threshold overrides"
        type: string
        default: ""
      dora-metrics:
        description: "Compute DORA-5 metrics"
        type: boolean
        default: false
      evaluation-store-url:
        description: "URL to POST evaluation JSON (optional)"
        type: string
        default: ""
    secrets:
      evaluation-store-secret:
        description: "Bearer token for evaluation store"
        required: false

permissions:
  contents: read
  pull-requests: write
  checks: write
  security-events: read

jobs:
  trailhead:
    # A distinct prefix keeps called-job serialization from canceling its caller.
    concurrency:
      group: trailhead-reusable-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ ((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'trailhead-override') && github.run_id || 'gate' }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: KomatikAI/trailhead@v4
        with:
          gate-mode: ${{ inputs.gate-mode }}
          check-name: ${{ inputs.check-name }}
          risk-threshold: ${{ inputs.risk-threshold }}
          wait-for-checks: ${{ inputs.wait-for-checks }}
          wait-timeout-minutes: ${{ inputs.wait-timeout-minutes }}
          environment: ${{ inputs.environment }}
          dora-metrics: ${{ inputs.dora-metrics }}
          evaluation-store-url: ${{ inputs.evaluation-store-url }}
          evaluation-store-secret: ${{ secrets.evaluation-store-secret }}
