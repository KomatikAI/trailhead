name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Action
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Build (ncc)
        run: npm run build

      # The action serves the COMMITTED dist/ at the tag (main: dist/index.js);
      # this workflow's build output is discarded. If the committed bundle does
      # not match a fresh build of the tagged source, the "release" ships stale
      # code — this happened silently on v4.5.5/v4.5.6 (dist last committed
      # 2026-06-07; the v4.5.5 import_resolution fix never reached consumers).
      - name: Verify committed dist matches this source
        run: |
          if ! git diff --quiet -- dist; then
            echo "::error::dist/ is stale — run 'npm run build' and commit dist before tagging"
            git diff --stat -- dist
            exit 1
          fi

      - name: Update major version tag
        run: |
          MAJOR=$(echo "${GITHUB_REF_NAME}" | grep -oP '^v\d+')
          git tag -f "${MAJOR}" HEAD
          git push origin "${MAJOR}" --force

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Trailhead ${GITHUB_REF_NAME}" \
            --generate-notes

  publish-cli:
    name: Publish CLI to npm
    runs-on: ubuntu-latest
    needs: release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install root deps (ncc + @swc/core for bundle)
        run: npm ci

      - name: Build CLI bundle
        run: npm run build:cli

      - name: Install CLI runtime deps (@swc/core optional platform binding)
        working-directory: cli
        run: npm ci --omit=dev

      - name: Verify CLI bundle
        run: node cli/dist/index.js doctor --offline --path .

      - name: Confirm npm auth
        working-directory: cli
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        working-directory: cli
        run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
