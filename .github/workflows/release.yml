name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Action
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Build (ncc)
        run: npm run build

      # The action serves the COMMITTED dist/ at the tag (main: dist/index.js).
      # v4.5.5/v4.5.6 silently shipped stale dist (last committed 2026-06-07;
      # the v4.5.5 import_resolution fix never reached consumers). ncc output
      # is NOT byte-reproducible across environments, so instead of failing on
      # any diff, make the CI build canonical: commit it and move the version
      # tag to that commit. The shipped bundle then always matches the tagged
      # source by construction. (GITHUB_TOKEN pushes don't re-trigger this
      # workflow, so the run continues to the major-tag + release steps below.)
      - name: Make CI-built dist canonical (commit + retag if it differs)
        run: |
          if ! git diff --quiet -- dist; then
            echo "dist differs from the CI build — committing the CI-built bundle and moving ${GITHUB_REF_NAME}"
            git diff --stat -- dist
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist
            git commit -m "build(release): CI-built dist for ${GITHUB_REF_NAME}"
            git tag -f "${GITHUB_REF_NAME}" HEAD
            git push origin "${GITHUB_REF_NAME}" --force
          fi

      - name: Update major version tag
        run: |
          MAJOR=$(echo "${GITHUB_REF_NAME}" | grep -oP '^v\d+')
          git tag -f "${MAJOR}" HEAD
          git push origin "${MAJOR}" --force

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Trailhead ${GITHUB_REF_NAME}" \
            --generate-notes

  publish-cli:
    name: Publish CLI to npm
    runs-on: ubuntu-latest
    needs: release

    steps:
      # Re-resolve the tag instead of taking checkout's default (github.sha,
      # frozen at the commit the tag pointed to when the run triggered): the
      # release job above may have force-moved the tag onto the CI-built dist
      # commit, and checkout@v7 fails the run when ref and expected sha
      # disagree (v4.7.0's CLI publish died here, twice).
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - name: Install root deps (ncc + @swc/core for bundle)
        run: npm ci

      - name: Build CLI bundle
        run: npm run build:cli

      - name: Install CLI runtime deps (@swc/core optional platform binding)
        working-directory: cli
        run: npm ci --omit=dev

      - name: Verify CLI bundle
        run: node cli/dist/index.js doctor --offline --path .

      - name: Confirm npm auth
        working-directory: cli
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        working-directory: cli
        run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
