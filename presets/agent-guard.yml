# AI-authored PRs — submission gate + remediation before merge (no fleet-only checks).
# Adopt: cp presets/agent-guard.yml .trailhead.yml  (or: npx @komatikai/trailhead init → agent)
# Enable workflow: submission-gate: "true" (init wizard adds this).

schema_version: 2

gate:
  mode: release-ready
  agent_brief: collapsed

thresholds:
  risk: 60
  warn: 40

contexts:
  - name: main
    match:
      base_branch:
        - main
        - master
    environment: production
    ci:
      required_checks:
        - CI
        - Build
      missing_required: fail

policies:
  agent_prs:
    enabled: true
    risk_threshold: 40
    strict_on_unknown_provenance: true
    require_code_owner_approval: false
  ci_integrity:
    mode: block
  workflow_security:
    mode: block
  prompt_injection:
    mode: block
  pr_scope:
    mode: warn
    max_files: 30
    max_changes: 1500

remediation:
  enabled: true
  max_loop_rounds: 5

submission:
  enabled: true
  mode: block

security:
  severity_threshold: warning
  block_on_critical: true

override:
  enabled: true
  max_per_week: 5

tuning:
  auto_downgrade: true
  fp_threshold: 0.15
