# Merge into .circleci/config.yml. The GitHub Trailhead Action polls the provider:
#   circleci-token: ${{ secrets.CIRCLECI_TOKEN }}
#   circleci-project-slug: gh/owner/repo
# Configure lint and test as required jobs in .trailhead.yml.
# No reporter invents a passed result; the adapter reads actual provider jobs.
version: 2.1
jobs:
  lint:
    docker:
      - image: cimg/node:22.0
    steps:
      - checkout
      - run: npm ci && npm run lint
  test:
    docker:
      - image: cimg/node:22.0
    steps:
      - checkout
      - run: npm ci && npm test
workflows:
  pr-gate:
    jobs:
      - lint
      - test
