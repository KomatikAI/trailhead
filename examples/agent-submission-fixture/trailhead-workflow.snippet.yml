# Copy into .github/workflows/ — validates agent PR quality (Gate 1) + release readiness.
name: Trailhead

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

concurrency:
  group: trailhead-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ ((github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'trailhead-override') && github.run_id || 'gate' }}
  cancel-in-progress: true

jobs:
  gate:
    if: >-
      (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
      github.event.label.name == 'trailhead-override'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
      security-events: read
    steps:
      - uses: actions/checkout@v4

      - uses: KomatikAI/trailhead@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          submission-gate: "true"
        env:
          # Optional: trust metrics JSON until Cloud nightly compute (B3 follow-up)
          # TRAILHEAD_AGENT_TRUST_JSON: ${{ secrets.TRAILHEAD_AGENT_TRUST_JSON }}
