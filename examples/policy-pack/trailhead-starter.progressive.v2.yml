# v4 progressive promotion policy with branch-aware contexts.
# See docs/migration-v3-to-v4.md

schema_version: 2

gate:
  mode: release-ready
  check_name: "Trailhead — Release Ready"

thresholds:
  risk: 80
  warn: 60

contexts:
  - name: feature
    match:
      base_branch: [dev, develop]
    environment: dev
    thresholds:
      risk: 85
      warn: 65
    ci:
      required_checks: [CI Gate, Build]
      optional_checks: [Playwright]
      missing_required: skip

  - name: staging-promotion
    match:
      base_branch: [staging]
    environment: staging
    thresholds:
      risk: 75
      warn: 55
    ci:
      required_checks: [CI Gate, Build, Playwright]
      missing_required: fail

  - name: production-promotion
    match:
      base_branch: [main, master]
    environment: production
    thresholds:
      risk: 65
      warn: 45
    ci:
      required_checks: [CI Gate, Build, Playwright, Security Gate]
      missing_required: fail

environments:
  dev:
    risk: 85
    warn: 65
  staging:
    risk: 75
    warn: 55
  production:
    risk: 65
    warn: 45
    require_security_clear: true

security:
  severity_threshold: warning
  block_on_critical: true

canary:
  webhook_type: generic

freeze:
  - days: ["friday"]
    afterHour: 15
    message: "No Friday afternoon promotions"
