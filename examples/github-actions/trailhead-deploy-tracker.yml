# Copy this workflow AND scripts/record-deploy-correlation.mjs into your repository.
# The deployment provider must publish GitHub deployment_status events with the
# full deployed SHA, production_environment=true and environment=Production.
# A push, green build or successful gate alone is not a successful deployment.
name: Trailhead deploy correlation

on:
  deployment_status:

permissions:
  contents: read

jobs:
  record-deploy:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.production_environment == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Execute reviewed collector code, never the deployed candidate checkout.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Correlate observed successful deployment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TRAILHEAD_PRODUCTION_ENVIRONMENT: ${{ vars.TRAILHEAD_PRODUCTION_ENVIRONMENT }}
          # Optional, 0 (disabled) to 24 hours. Ambiguous windows do not write.
          TRAILHEAD_DEPLOY_MATCH_WINDOW_HOURS: ${{ vars.TRAILHEAD_DEPLOY_MATCH_WINDOW_HOURS }}
        run: node scripts/record-deploy-correlation.mjs
