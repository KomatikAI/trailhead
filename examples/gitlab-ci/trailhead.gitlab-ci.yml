# Copy to .gitlab-ci.yml. The GitHub Trailhead Action polls actual provider jobs:
#   gitlab-token: ${{ secrets.GITLAB_TOKEN }}
#   gitlab-project-id: '123'
#   gitlab-api-url: https://gitlab.com/api/v4
# Configure lint and test as required jobs in .trailhead.yml.
# Do not infer sibling job outcomes from a reporter job's CI_JOB_STATUS.
stages:
  - test
lint:
  stage: test
  image: node:22-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - npm ci
    - npm run lint
test:
  stage: test
  image: node:22-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - npm ci
    - npm test
